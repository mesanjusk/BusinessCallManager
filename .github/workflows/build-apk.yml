name: Build Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/businesscallmanager.keystore

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Prod Release APK
        working-directory: android
        run: ./gradlew assembleProdRelease --stacktrace
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/Prod/release/*.apk BusinessCallManager.apk

      - name: Delete existing release if exists
        run: |
          gh release delete latest --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release with APK
        run: |
          gh release create latest BusinessCallManager.apk \
            --title "Business Call Manager - Latest Build" \
            --notes "Latest release. Download BusinessCallManager.apk below." \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
