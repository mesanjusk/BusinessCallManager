name: Build Release APK + AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/businesscallmanager.keystore

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Prod Release APK + AAB
        working-directory: android
        run: ./gradlew assembleProdRelease bundleProdRelease 2>&1 | tee /tmp/build_output.txt; BUILD_EXIT=${PIPESTATUS[0]}; echo ""; echo "=== COMPILER ERRORS ==="; grep -E "^e: |error:|\.kt:[0-9]" /tmp/build_output.txt | head -40 || true; exit $BUILD_EXIT
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename output files
        run: |
          cp android/app/build/outputs/apk/Prod/release/*.apk BusinessCallManager.apk
          cp android/app/build/outputs/bundle/ProdRelease/*.aab BusinessCallManager.aab

      - name: Delete existing release if exists
        run: |
          gh release delete latest --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release with APK and AAB
        run: |
          gh release create latest BusinessCallManager.apk BusinessCallManager.aab \
            --title "Business Call Manager - Latest Build" \
            --notes "APK: direct install on Android | AAB: upload to Google Play Store" \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
